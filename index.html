<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Balança v2.2 - Agrinho 2026</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .sub-titulo {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Indicador de Conexão */
        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 20px;
        }

        .circulo {
            width: 15px;
            height: 15px;
            background-color: #95a5a6; /* Cinza inicial */
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .texto-status {
            font-weight: 600;
            font-size: 14px;
            color: #7f8c8d;
        }

        /* Display de Peso */
        .display-peso {
            font-size: 64px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
            font-family: monospace;
        }

        /* Botão de Conexão */
        .btn-conectar {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.2);
        }

        .btn-conectar:hover {
            background-color: #2980b9;
        }

        .btn-conectar:active {
            transform: scale(0.98);
        }

        /* Mensagem de Ajuda Técnica */
        .aviso-tecnico {
            margin-top: 15px;
            font-size: 12px;
            color: #e74c3c;
            display: none;
            background-color: #fdf2f2;
            padding: 8px;
            border-radius: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Balança Inteligente</h1>
        <div class="sub-titulo">Simulador de Desperdício de Alimentos</div>

        <div class="status-container">
            <div id="status-circulo" class="circulo"></div>
            <span id="status-texto" class="texto-status">Aguardando USB</span>
        </div>

        <div id="peso-display" class="display-peso">0.0 g</div>

        <button id="btn-conexao" class="btn-conectar" onclick="conectarBalanca()">Conectar Balança</button>
        
        <div id="alerta-porta" class="aviso-tecnico">⚠️ Feche o Monitor Serial da IDE do Arduino!</div>
    </div>

    <script>
        let port = null;
        let reader = null;

        async function conectarBalanca() {
            // Verifica se o navegador suporta Web Serial
            if (!("serial" in navigator)) {
                alert("Este navegador não suporta conexão USB direta. Use o Google Chrome ou Edge.");
                return;
            }

            document.getElementById("alerta-porta").style.display = "none";

            try {
                // 1. Solicita a porta COM ao usuário
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });

                // 2. Atualiza interface para Conectado (Verde)
                atualizarStatus("#2ecc71", "Balança Conectada");
                document.getElementById("btn-conexao").style.display = "none";

                const textDecoderStream = new TextDecoderStream();
                port.readable.pipeTo(textDecoderStream.writable);
                const inputStream = textDecoderStream.readable;

                    .pipeThrough(new TransformStream(new LineBreakTransformer()))
                    .getReader();
