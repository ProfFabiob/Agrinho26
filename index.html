<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Balança - Agrinho 2026</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .sub-titulo {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Indicador de Conexão */
        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 20px;
        }

        .circulo {
            width: 15px;
            height: 15px;
            background-color: #95a5a6; /* Cinza inicial */
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .texto-status {
            font-weight: 600;
            font-size: 14px;
            color: #7f8c8d;
        }

        /* Display de Peso */
        .display-peso {
            font-size: 64px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
            font-family: monospace;
        }

        /* Botão de Conexão */
        .btn-conectar {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.2);
        }

        .btn-conectar:hover {
            background-color: #2980b9;
        }

        .btn-conectar:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Balança Inteligente</h1>
        <div class="sub-titulo">Simulador de Desperdício de Alimentos</div>

        <div class="status-container">
            <div id="status-circulo" class="circulo"></div>
            <span id="status-texto" class="texto-status">Aguardando USB</span>
        </div>

        <div id="peso-display" class="display-peso">0.0 g</div>

        <button id="btn-conexao" class="btn-conectar" onclick="conectarBalanca()">Conectar Balança</button>
    </div>

    <script>
        let port;
        let reader;
        let decoderStream;
        let inputStream;

        async function conectarBalanca() {
            // Se já estiver conectado, essa função evita abrir duplicado
            if (port) {
                alert("A balança já está em processo de conexão.");
                return;
            }

            try {
                // 1. Solicita acesso à porta USB COM do Arduino
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });

                // 2. Atualiza a interface para o status Verde (Conectado)
                document.getElementById("status-circulo").style.backgroundColor = "#2ecc71";
                document.getElementById("status-texto").innerText = "Balança Conectada";
                document.getElementById("status-texto").style.color = "#2ecc71";
                document.getElementById("btn-conexao").style.display = "none"; // Esconde o botão após conectar

                // 3. Configura o decodificador de texto para ler o fluxo de dados
                decoderStream = new TextDecoderStream();
                port.readable.pipeTo(decoderStream.writable);
                inputStream = decoderStream.readable;
                
                // Aplica o transformador de quebra de linha para receber strings inteiras (\r\n)
                reader = inputStream
                    .pipeThrough(new TransformStream(new LineBreakTransformer()))
                    .getReader();

                // 4. Loop infinito escutando os dados enviados pelo cabo USB
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) {
                        break; 
                    }
                    if (value) {
                        processarDadosBalanca(value);
                    }
                }

            } catch (error) {
                console.error("Erro ao conectar na porta serial:", error);
                // Reseta visual se o usuário cancelar ou der erro
                document.getElementById("status-circulo").style.backgroundColor = "#e74c3c";
                document.getElementById("status-texto").innerText = "Erro na conexão";
                document.getElementById("status-texto").style.color = "#e74c3c";
                port = null;
            }
        }

        // --- PROCESSADOR DO JSON ENVIADO PELO ARDUINO ---
        function processarDadosBalanca(linhaTexto) {
            try {
                const textoLimpo = linhaTexto.trim(); 
                
                // Converte a string JSON de volta para objeto JS
                const dados = JSON.parse(textoLimpo);
                
                // Se o dado contiver o valor do peso, joga no display HTML
                if (dados.peso !== undefined) {
                    document.getElementById("peso-display").innerText = dados.peso.toFixed(1) + " g";
                    
                    // Integração Futura: Adicione aqui as funções que alteram o seu gráfico 
                    // ou os cálculos de impacto financeiro do desperdício.
                }
            } catch (e) {
                // Evita que erros de leitura inicial quebrem o carregamento da página
                console.log("Sincronizando fluxo de dados...");
            }
        }

        // --- FILTRO AUXILIAR DE LINHA (Agrupa os caracteres até achar o fim da linha) ---
        class LineBreakTransformer {
            constructor() {
                this.container = "";
            }
            transform(chunk, controller) {
                this.container += chunk;
                // O Arduino Uno envia o divisor de linha padrão \r\n ao usar Serial.println
                const lines = this.container.split("\r\n"); 
                this.container = lines.pop();
                lines.forEach(line => controller.enqueue(line));
            }
            flush(controller) {
                controller.enqueue(this.container);
            }
        }
    </script>
</body>
</html>
