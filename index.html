<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Balança v2.2 - Agrinho</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: #1a1a1a;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .status-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f8f9fa;
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 24px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #7f8c8d;
            border-radius: 50%;
        }
        .status-text {
            font-size: 14px;
            font-weight: 500;
            color: #7f8c8d;
        }
        .weight-display {
            font-size: 64px;
            font-weight: 700;
            color: #2c3e50;
            margin: 20px 0;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Balança Inteligente</h1>
    <div class="subtitle">Simulador de Desperdício de Alimentos</div>
    
    <div class="status-box">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-text" class="status-text">Aguardando USB</span>
    </div>
    
    <div id="weight" class="weight-display">0.0 g</div>
    
    <button id="btn-connect" class="btn" onclick="connectSerial()">Conectar Balança</button>
</div>

<script>
let port;
let keepReading = true;
let reader;

async function connectSerial() {
    try {
        // Solicita a porta COM do Arduino
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        
        // Atualiza interface para Conectado (Verde)
        document.getElementById('status-dot').style.backgroundColor = '#2ecc71';
        document.getElementById('status-text').innerText = 'Balança Conectada';
        document.getElementById('status-text').style.color = '#2ecc71';
        document.getElementById('btn-connect').style.display = 'none';

        const decoder = new TextDecoder();
        let buffer = '';

        // Loop de leitura contínuo v2.2
        while (port.readable && keepReading) {
            reader = port.readable.getReader();
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    // Transforma os bytes recebidos em texto e junta ao buffer
                    buffer += decoder.decode(value, { stream: true });
                    
                    // Quebra o buffer pelas linhas completas (\n)
                    let lines = buffer.split('\n');
                    buffer = lines.pop(); // Mantém a linha incompleta no buffer para a próxima leitura
                    
                    for (let line of lines) {
                        if (line.trim() !== '') {
                            parseData(line);
                        }
                    }
                }
            } catch (error) {
                console.error("Erro na leitura dos dados:", error);
            } finally {
                reader.releaseLock();
            }
        }
    } catch (error) {
        console.error("Erro ao conectar:", error);
        document.getElementById('status-dot').style.backgroundColor = '#e74c3c';
        document.getElementById('status-text').innerText = 'Erro na conexão';
        document.getElementById('status-text').style.color = '#e74c3c';
    }
}

function parseData(rawData) {
    try {
        // Limpa espaços e faz o parse do JSON enviado pelo Arduino v1.2
        const cleanData = rawData.trim();
        const json = JSON.parse(cleanData);
        
        if (json.peso !== undefined) {
            let valorPeso = json.peso;
            // Filtro para estabilizar pequenas oscilações perto de zero
            if (valorPeso < 0.5 && valorPeso > -0.5) {
                valorPeso = 0.0;
            }
            document.getElementById('weight').innerText = valorPeso.toFixed(1) + ' g';
        }
    } catch (e) {
        // Ignora pacotes cortados da inicialização
        console.log("Sincronizando dados...");
    }
}
</script>

</body>
</html>
